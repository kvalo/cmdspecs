#
# Copyright and license of the files which have no header: the
# configuration dotfiles, which are kept free of boilerplate, and the
# spec files, which cmdspecs compares byte for byte.

version = 1

[[annotations]]
path = [
    ".flake8",
    ".gitattributes",
    ".mdlrc",
    ".mdl_style.rb",
    ".yamllint",
]
SPDX-FileCopyrightText = "2026 Kalle Valo"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ".gitignore"
SPDX-FileCopyrightText = "2025-2026 Kalle Valo"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The echo and fail specs are based on the tests of cmdtest.
[[annotations]]
path = ["tests/specs/echo/**", "tests/specs/fail/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2011 Lars Wirzenius",
    "2025-2026 Kalle Valo",
]
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
    "tests/specs/env/**",
    "tests/specs/exit/**",
    "tests/specs/hooks/**",
    "tests/specs/sort/**",
    "tests/specs/stderr/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kalle Valo"
SPDX-License-Identifier = "GPL-3.0-or-later"
