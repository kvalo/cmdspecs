name: CI

on:
  push:
  pull_request:
  # Catch breakage from new Python releases and runner image updates
  # even when the repository is quiet.
  schedule:
    - cron: "43 5 12 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flake8 python3-pytest shellcheck groff markdownlint
      - name: Run tests
        run: ./check
      - name: Run linters
        run: ./lint

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install .[test]
      - name: Run tests
        run: ./check

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pytest
        # Homebrew's Python is externally managed, so use a venv.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .[test]
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: ./check
