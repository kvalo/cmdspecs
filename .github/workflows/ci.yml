name: CI

on:
  push:
  pull_request:
  # Catch breakage from new Python releases and runner image updates
  # even when the repository is quiet.
  schedule:
    - cron: "43 5 12 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flake8 python3-pytest shellcheck groff markdownlint yamllint
      - name: Run tests
        run: ./check
      - name: Run linters
        run: ./lint

  # The linters don't depend on the architecture, so only run the
  # tests.
  test-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest
      - name: Run tests
        run: ./check

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest and linters
        run: pip install .[test,lint]
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: Install markdownlint
        run: gem install mdl
      - name: Run tests
        run: ./check
      - name: Run linters
        # groff is expected to come with the runner image (man-db).
        run: ./lint

  # GitHub has no BSD runners, so run the tests in a VM. The linters
  # don't depend on the OS, so only run the tests.
  test-bsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: "15.1"
            install: sudo pkg install -y python3 py312-pytest
          - os: openbsd
            version: "8.0"
            install: sudo pkg_add python%3 py3-test
    steps:
      - uses: actions/checkout@v7
      - name: Start VM
        uses: cross-platform-actions/action@v1.8.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
      - name: Install pytest
        shell: cpa.sh {0}
        run: ${{ matrix.install }}
      - name: Run tests
        shell: cpa.sh {0}
        run: ./check

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pytest
        # Homebrew's Python is externally managed, so use a venv.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .[test]
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: ./check

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install pytest
        run: pip install ".[test]"
      # cmdspecs finds a different sh from PowerShell and from Git Bash,
      # and the scripts get a different PATH, so test both.
      - name: Run tests from PowerShell
        run: python -m pytest
      - name: Run tests from Git Bash
        shell: bash
        run: ./check
