[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdspecs"
version = "0.33+git"
description = "black box testing of Unix command line tools"
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
authors = [
    {name = "Lars Wirzenius", email = "liw@liw.fi"},
    {name = "Kalle Valo", email = "kalle@valot.fi"}
]
maintainers = [
    {name = "Kalle Valo", email = "kalle@valot.fi"}
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
"Original cmdtest" = "https://liw.fi/cmdtest/"

# cmdspecs is a single script with no package, so ship it with
# script-files and the manpage with data-files.
[tool.setuptools]
packages = []
script-files = ["cmdspecs"]

[tool.setuptools.data-files]
"share/man/man1" = ["cmdspecs.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
