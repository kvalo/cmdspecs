[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdspecs"
version = "0.33"
description = "blackbox testing of Unix command line tools"
readme = "README"
license = "GPL-3.0-or-later"
authors = [
    {name = "Lars Wirzenius", email = "liw@liw.fi"},
    {name = "Kalle Valo", email = "kalle@valot.fi"}
]
maintainers = [
    {name = "Kalle Valo", email = "kalle@valot.fi"}
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
"Original cmdtest" = "https://liw.fi/cmdtest/"

[tool.setuptools]
script-files = ["cmdspecs"]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.data-files]
"share/man/man1" = ["cmdspecs.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
